<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1a12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>SPIRETONE</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a1a12; overflow: hidden; }
      /* A game screen: no pinch, scroll bounce or tap flash. */
      html, body { touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      /* Soft vignette over the scene, under the HUD: pulls the eye to the island. */
      #app::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 80% 75% at 50% 47%, transparent 50%, rgba(18, 10, 4, 0.34) 100%);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
